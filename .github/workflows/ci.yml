name: CI

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  quality:
    name: Quality checks
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      - name: Typecheck
        run: npm run typecheck

      - name: Verify event timeline test discovery
        run: npm exec -- vitest list --filesOnly | grep -Fx tests/event-timeline.test.tsx

      - name: Run unit tests
        run: npm run test

      - name: Build
        run: npm run build

  database:
    name: Draft migration and RLS
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: disposable-ci-password
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Apply migrations and verify draft, media and checkout authorization
        env:
          DB_CONTAINER: ${{ job.services.postgres.id }}
        run: |
          docker exec -i "$DB_CONTAINER" psql -U postgres -v ON_ERROR_STOP=1 --single-transaction < supabase/fixtures/test-auth.sql
          for migration in supabase/migrations/*.sql; do
            docker exec -i "$DB_CONTAINER" psql -U postgres -v ON_ERROR_STOP=1 --single-transaction < "$migration"
          done
          docker exec -i "$DB_CONTAINER" psql -U postgres -v ON_ERROR_STOP=1 < supabase/tests/auth_drafts.sql
          docker exec -i "$DB_CONTAINER" psql -U postgres -v ON_ERROR_STOP=1 < supabase/tests/private_draft_media.sql
      - name: Rehearse schema export and draft restore
        env:
          DB_CONTAINER: ${{ job.services.postgres.id }}
        run: |
          backup_dir=$(mktemp -d)
          docker exec -i "$DB_CONTAINER" psql -XqAt -U postgres -v ON_ERROR_STOP=1 -v seed_backup_fixture=1 < supabase/tests/draft_backup.sql > "$backup_dir/source.fingerprint"
          grep -Exq '[0-9a-f]{32}' "$backup_dir/source.fingerprint"
          docker exec "$DB_CONTAINER" pg_dump -U postgres --schema-only > "$backup_dir/schema.sql"
          test -s "$backup_dir/schema.sql"
          docker exec "$DB_CONTAINER" pg_dump -U postgres --format=custom > "$backup_dir/drafts.backup"
          docker exec "$DB_CONTAINER" createdb -U postgres --template=template0 yugma_restore
          docker exec -i "$DB_CONTAINER" pg_restore -U postgres --exit-on-error --single-transaction --dbname=yugma_restore < "$backup_dir/drafts.backup"
          docker exec -i "$DB_CONTAINER" psql -XqAt -U postgres -d yugma_restore -v ON_ERROR_STOP=1 -v seed_backup_fixture=0 < supabase/tests/draft_backup.sql > "$backup_dir/restored.fingerprint"
          diff -u "$backup_dir/source.fingerprint" "$backup_dir/restored.fingerprint"
          docker exec -i "$DB_CONTAINER" psql -U postgres -d yugma_restore -v ON_ERROR_STOP=1 < supabase/tests/auth_drafts.sql
